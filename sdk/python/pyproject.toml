[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtensor"
version = "0.1.0"
description = "A lean Python SDK and CLI for interacting with the Bittensor chain."
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "RaoFoundation" }]
dependencies = [
    # Transport (subtensor/_transport) runtime deps
    "cyscale>=0.3.3,<1.0.0",
    "websockets>=14.1",
    "xxhash",
    "typing_extensions>=4.0.0; python_version<'3.11'",
    # Keys and timelock crypto
    "bittensor-wallet>=4.0.0,<5.0.0",
    "bittensor-drand>=1.3.0,<2.0.0",
]

# The library itself has no terminal-UI dependencies; the `subtensor` command
# needs them. Install with `pip install 'subtensor[cli]'` for the CLI.
[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
subtensor = "subtensor.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["subtensor"]

# Ship shell-completion scripts to the standard system locations so shells pick
# them up automatically (no `subtensor --install-completion` step needed).
[tool.hatch.build.targets.wheel.shared-data]
"completions/subtensor.bash" = "share/bash-completion/completions/subtensor"
"completions/_subtensor" = "share/zsh/site-functions/_subtensor"
"completions/subtensor.fish" = "share/fish/vendor_completions.d/subtensor.fish"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
